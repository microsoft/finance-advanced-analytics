# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]

name: bookdown

jobs:
  bookdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - uses: r-lib/actions/setup-pandoc@f5b3dfbf1942ce68283de21bf65cce051e3a2c4d # v1.0.2

      - uses: r-lib/actions/setup-r@f5b3dfbf1942ce68283de21bf65cce051e3a2c4d # v1.0.2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@f5b3dfbf1942ce68283de21bf65cce051e3a2c4d # v1.0.2

      - name: Cache bookdown results
        uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
        with:
          path: book-content/_bookdown_files
          key: bookdown-${{ hashFiles('**/*Rmd') }}
          restore-keys: bookdown-
      
      - name: Install packages
        run: Rscript -e 'install.packages(c("rmarkdown","bookdown"))'
      
      - name: Build site
        run: Rscript -e 'bookdown::render_book("book-content", quiet = TRUE)'

      - name: Deploy to GitHub pages 🚀
        uses: JamesIves/github-pages-deploy-action@5dc1d5a192aeb5ab5b7d5a77b7d36aea4a7f5c92 # 4.1.4
        with:
          branch: gh-pages
          folder: book-content/_book
 
